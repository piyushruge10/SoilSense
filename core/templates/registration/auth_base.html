{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Account{% endblock %} · SoilSense</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="{% url 'login' %}"><span class="brand-mark">S</span><span>SoilSense<small>GROW WITH CONFIDENCE</small></span></a>
    <section class="panel auth-card">
      {% block auth_content %}{% endblock %}
    </section>
    <p class="auth-footer">Soil monitoring for healthier growing.</p>
  </main>
</body>
</html>
